<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanguard | Cadastro</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card neon-border-cyan">
        <p class="eyebrow">Nova conta</p>
        <h2>Cadastro</h2>
        <p>Crie sua conta e comece a agendar no seu estilo.</p>
        <form id="formCadastro">
          <input type="text" id="nome" placeholder="Nome Completo" required />
          <input type="text" id="cpf" placeholder="CPF" required />
          <input type="text" id="whatsapp" placeholder="WhatsApp" required />
          <input type="email" id="email" placeholder="E-mail" required />
          <input type="password" id="senha" placeholder="Senha" required />
          <button type="submit" class="btn btn-neon-magenta">Cadastrar</button>
        </form>
        <p class="auth-link">
          Já tem conta?
          <a href="login.html">Entrar</a>
        </p>
      </div>
    </div>

    
    <script src="js/auth.js"></script>
  </body>
</html>
