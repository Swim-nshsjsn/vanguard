<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanguard | Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card neon-border-pink">
        <p class="eyebrow">Acesso exclusivo</p>
        <h2>Entrar</h2>
        <p>Use seu WhatsApp e senha para acessar o painel do cliente.</p>
        <form id="formLogin">
          <input type="text" id="loginWhats" placeholder="WhatsApp" required />
          <input type="password" id="loginSenha" placeholder="Senha" required />
          <button type="submit" class="btn btn-neon-magenta">Entrar</button>
        </form>
        <p class="auth-link">
          Ainda não tem conta?
          <a href="cadastro.html">Cadastre-se</a>
        </p>
        <p class="hint">Admin: WhatsApp <strong>admin</strong> · senha <strong>admin123</strong></p>
      </div>
    </div>

    
    <script src="js/auth.js"></script>
  </body>
</html>
