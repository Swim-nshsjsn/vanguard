<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Vanguard Barber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo-wrap"><a href="../index.html" class="logo">VANGUARD</a></div>
    <nav class="nav-links">
      <a href="../index.html">Início</a>
      <a href="sobre.html">Sobre</a>
      <a href="servicos.html">Serviços</a>
      <a href="galeria.html">Galeria</a>
      <a href="contato.html">Contato</a>
    </nav>
    <div class="header-actions">
      <a href="cadastro.html" class="btn btn-ghost">CADASTRO</a>
    </div>
  </header>

  <main class="page-shell">
    <section class="auth-card card reveal">
      <h2>Login</h2>
      <form id="loginForm" class="auth-form">
        <input type="email" id="loginEmail" placeholder="E-mail" required />
        <input type="password" id="loginPassword" placeholder="Senha" required />
        <button type="submit" class="btn btn-primary">ENTRAR</button>
      </form>
      <p id="loginMessage" class="message"></p>
    </section>
  </main>

  <script src="../script.js"></script>
</body>
</html>
