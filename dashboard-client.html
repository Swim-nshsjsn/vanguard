<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Cliente | Vanguard Barber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dashboard-shell">
    <aside class="sidebar card">
      <h2 class="logo">VANGUARD</h2>
      <nav class="sidebar-nav">
        <a href="#">Galeria</a>
        <a href="#">Sobre</a>
        <a href="#">Agendamento</a>
        <a href="#">Feed</a>
        <a href="#">Barbeiros</a>
      </nav>
    </aside>
    <main class="dashboard-main">
      <header class="dashboard-header card">
        <div>
          <p class="eyebrow">PAINEL CLIENTE</p>
          <h1 id="clientName">Cliente</h1>
        </div>
        <div class="profile-pill">
          <span>●</span>
          <strong id="clientProfileName">Cliente</strong>
        </div>
      </header>

      <section class="card reveal">
        <h3>Agendamento</h3>
        <form id="bookingForm" class="auth-form">
          <select id="serviceSelect"></select>
          <select id="barberSelect"></select>
          <input type="date" id="bookingDate" />
          <select id="timeSelect"></select>
          <button class="btn btn-primary" type="submit">CONFIRMAR</button>
        </form>
        <p id="bookingMessage" class="message"></p>
      </section>

      <section class="card reveal">
        <h3>Feed de feedback</h3>
        <form id="feedbackForm" class="auth-form">
          <select id="feedbackBarber"></select>
          <input type="number" id="rating" min="1" max="5" value="5" />
          <textarea id="comment" placeholder="Seu feedback..."></textarea>
          <button class="btn btn-primary" type="submit">ENVIAR</button>
        </form>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
